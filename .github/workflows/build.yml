name: Build Quandong S3 Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build quandong-s3-dev
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    env:
      ZELLO_USERNAME: ${{ secrets.ZELLO_USERNAME }}
      ZELLO_PASSWORD: ${{ secrets.ZELLO_PASSWORD }}
      ZELLO_AUTH_TOKEN: ${{ secrets.ZELLO_AUTH_TOKEN }}
      ZELLO_CHANNEL: ${{ secrets.ZELLO_CHANNEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build quandong-s3-dev
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py quandong-s3-dev

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-quandong-s3-dev
          path: build/merged-binary.bin
          if-no-files-found: error